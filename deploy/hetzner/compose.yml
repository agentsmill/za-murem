# Za Murem na serwerze Hetznera: Caddy z HTTPS serwuje zbudowaną grę (www/ to kopia dist/), a /api przekazuje
# do serwera gry sieciowej (server/, kontener api bez portu na zewnątrz: dostaje się do niego tylko Caddy).
# Adres strony (SITE) i adres IP (IP) siedzą w pliku .env na serwerze, nie w repozytorium.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE=${SITE}
      - IP=${IP}
    volumes:
      - ./conf:/etc/caddy:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./serwer-zrodla
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - ZM_ZRODLA=https://${SITE}
    volumes:
      - dane:/dane

volumes:
  caddy_data:
  caddy_config:
  dane:
